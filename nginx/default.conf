server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Docker DNS обновляет адрес backend после пересоздания контейнера.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location /api/ {
        # Сохраняем весь путь /api/v1/... и query-параметры.
        proxy_pass $api$request_uri;
    }

    location ~ ^/(docs|redoc|openapi\.json|health)(/|$) {
        proxy_pass $api$request_uri;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
