name: microvolnovkkka-lab3

services:
  db:
    build: ./docker/postgis
    environment:
      POSTGRES_DB: moscow_events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lab3-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: >-
        PGPASSWORD="$$POSTGRES_PASSWORD" psql -w -h db
        -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c 'SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      PG_HOST: db
      PG_DB_NAME: moscow_events
      PG_USER_NAME: postgres
      PG_USER_PASSWORD: ${DB_PASSWORD:-lab3-local-password}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: nginx:stable-alpine
    ports:
      - "${HTTP_PORT:-8082}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
